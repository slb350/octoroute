name: One-shot update chacha20 to non-yanked release

on:
  push:
    branches:
      - feat/v3-tiered-inference-fabric
    paths:
      - .github/workflows/one-shot-unyank-chacha.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Update only chacha20
        run: |
          cargo update -p chacha20 --precise 0.10.2
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Cargo.lock').read_text()
          marker = 'name = "chacha20"\nversion = "0.10.2"'
          if marker not in text:
              raise SystemExit('Cargo.lock did not select chacha20 0.10.2')
          PY
          git diff --stat -- Cargo.lock
          git diff -- Cargo.lock

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Audit the updated lockfile
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

      - name: Commit the lockfile update
        shell: bash
        run: |
          rm .github/workflows/one-shot-unyank-chacha.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/one-shot-unyank-chacha.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): update chacha20 to 0.10.2"
          git push origin HEAD:${{ github.ref_name }}
