name: One-shot trace rand 0.10 reverse dependency

on:
  push:
    branches:
      - feat/v3-tiered-inference-fabric
    paths:
      - .github/workflows/one-shot-unyank-chacha.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Show reverse dependency paths
        run: |
          echo '=== rand 0.10.2 ==='
          cargo tree --locked -i rand@0.10.2
          echo '=== chacha20 0.10.1 ==='
          cargo tree --locked -i chacha20@0.10.1
          echo '=== feature path for rand 0.10.2 ==='
          cargo tree --locked -e features -i rand@0.10.2
