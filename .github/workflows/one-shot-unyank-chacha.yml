name: One-shot prune stale yanked lockfile entries

on:
  push:
    branches:
      - feat/v3-tiered-inference-fabric
    paths:
      - .github/workflows/one-shot-unyank-chacha.yml

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Prune stale lockfile entries
        run: |
          cargo update
          if grep -q 'name = "chacha20"' Cargo.lock; then
            echo 'stale chacha20 entry remains' >&2
            exit 1
          fi
          if grep -A2 'name = "rand"' Cargo.lock | grep -q 'version = "0.10'; then
            echo 'stale rand 0.10 entry remains' >&2
            exit 1
          fi
          git diff --stat -- Cargo.lock
          git diff -- Cargo.lock

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Audit the pruned lockfile
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

      - name: Commit the lockfile cleanup
        shell: bash
        run: |
          rm .github/workflows/one-shot-unyank-chacha.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/one-shot-unyank-chacha.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): prune stale yanked lockfile entries"
          git push origin HEAD:${{ github.ref_name }}
