name: One-shot model terminology cleanup

on:
  push:
    branches:
      - feat/v3-tiered-inference-fabric
    paths:
      - .github/workflows/one-shot-v3-agnostic-cleanup.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rewrite terminology and examples
        run: python3 scripts/one_shot_cleanup.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/one-shot-v3-agnostic-cleanup.yml
          rm scripts/one_shot_cleanup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: make local model terminology deployment-agnostic"
          git push origin HEAD:${{ github.ref_name }}
