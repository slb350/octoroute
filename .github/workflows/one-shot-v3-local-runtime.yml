           'src/gateway/runtime.rs': '//! Version-aware startup configuration for the v2 gateway and v3 inference fabric.\n'
                                     '\n'
                                     'use crate::gateway::{\n'
                                     '    config::{Environment, GatewayConfig, GatewayConfigError},\n'
                                     '    fabric::{FabricConfig, FabricConfigError},\n'
                                     '};\n'
                                     'use thiserror::Error;\n'
                                     '\n'
                                     '/// Validated runtime configuration selected from the declared schema version.\n'
                                     '#[derive(Debug, Clone)]\n'
                                     'pub enum RuntimeConfig {\n'
                                     '    V2(Box<GatewayConfig>),\n'
                                     '    V3(Box<FabricConfig>),\n'
                                     '}\n'
                                     '\n'
                                     'impl RuntimeConfig {\n'
                                     '    /// Parse either a v2 or v3 configuration without weakening either schema.\n'
                                     '    pub fn from_toml(\n'
                                     '        input: &str,\n'
                                     '        environment: &impl Environment,\n'
                                     '    ) -> Result<Self, RuntimeConfigError> {\n'
                                     '        let value: toml::Value =\n'
                                     '            toml::from_str(input).map_err(|error| '
                                     'safe_parse_error(input, error))?;\n'
                                     '        let Some(version) = value\n'
                                     '            .get("config_version")\n'
                                     '            .and_then(toml::Value::as_integer)\n'
                                     '        else {\n'
                                     '            return GatewayConfig::from_toml(input, environment)\n'
                                     '                .map(|config| Self::V2(Box::new(config)))\n'
                                     '                .map_err(RuntimeConfigError::V2);\n'
                                     '        };\n'
                                     '\n'
                                     '        match version {\n'
                                     '            2 => GatewayConfig::from_toml(input, environment)\n'
                                     '                .map(|config| Self::V2(Box::new(config)))\n'
                                     '                .map_err(RuntimeConfigError::V2),\n'
                                     '            3 => FabricConfig::from_toml(input)\n'
                                     '                .map(|config| Self::V3(Box::new(config)))\n'
                                     '                .map_err(RuntimeConfigError::V3),\n'
                                     '            _ => Err(RuntimeConfigError::UnsupportedVersion { version }),\n'
                                     '        }\n'
                                     '    }\n'
                                     '\n'
                                     '    /// Declared configuration schema version.\n'
                                     '    pub fn version(&self) -> u8 {\n'
                                     '        match self {\n'
                                     '            Self::V2(_) => 2,\n'
                                     '            Self::V3(_) => 3,\n'
                                     '        }\n'
                                     '    }\n'
                                     '}\n'
                                     '\n'
                                     '/// Safe startup failures across supported configuration versions.\n'
                                     '#[derive(Debug, Error)]\n'
                                     'pub enum RuntimeConfigError {\n'
                                     '    #[error(transparent)]\n'
                                     '    V2(#[from] GatewayConfigError),\n'
                                     '    #[error(transparent)]\n'
                                     '    V3(#[from] FabricConfigError),\n'
                                     '    #[error("unsupported Octoroute configuration version {version}; expected 2 or 3")]\n'
                                     '    UnsupportedVersion { version: i64 },\n'
                                     '    #[error("invalid TOML at line {line}, column {column}; configuration values omitted")]\n'
                                     '    Parse { line: usize, column: usize },\n'
                                     '}\n'
                                     '\n'
                                     'fn safe_parse_error(input: &str, error: toml::de::Error) -> RuntimeConfigError {\n'
                                     '    let (line, column) = error\n'
                                     '        .span()\n'
                                     '        .map(|span| line_column(input, span.start))\n'
                                     '        .unwrap_or((1, 1));\n'
                                     '    RuntimeConfigError::Parse { line, column }\n'
                                     '}\n'
                                     '\n'
                                     'fn line_column(input: &str, byte_index: usize) -> (usize, usize) {\n'
                                     '    let prefix = &input[..byte_index.min(input.len())];\n'
                                     "    let line = prefix.bytes().filter(|byte| *byte == b'\\n').count() + 1;\n"
                                     '    let column = prefix\n'
                                     "        .rsplit_once('\\n')\n"
                                     '        .map_or(prefix.len() + 1, |(_, tail)| tail.len() + 1);\n'
                                     '    (line, column)\n'
                                     '}\n',
