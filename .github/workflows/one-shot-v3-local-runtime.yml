name: One-shot implement v3 local runtime

on:
  push:
    branches:
      - feat/v3-tiered-inference-fabric
    paths:
      - .github/workflows/one-shot-v3-local-runtime.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply v3 local-runtime implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = {'src/gateway/fabric/http.rs': '//! Axum HTTP surface for the executable v3 inference fabric.\n'
                                         '\n'
                                         'use super::{FabricGatewayService, FabricUpstreamTransport, PoolAdmissionState};\n'
                                         'use crate::gateway::{\n'
                                         '    http::security_headers,\n'
                                         '    service::{\n'
                                         '        MetadataAuthorizationError,\n'
                                         '        metadata_authorization_error as build_metadata_authorization_error,\n'
                                         '    },\n'
                                         '};\n'
                                         'use axum::{\n'
                                         '    Json, Router,\n'
                                         '    body::Body,\n'
                                         '    extract::State,\n'
                                         '    http::{HeaderMap, HeaderValue, Request, Response, StatusCode, header::CONTENT_TYPE},\n'
                                         '    middleware,\n'
                                         '    response::IntoResponse,\n'
                                         '    routing::{get, post},\n'
                                         '};\n'
                                         'use serde_json::{Map, Value, json};\n'
                                         'use std::sync::Arc;\n'
                                         'use uuid::Uuid;\n'
                                         '\n'
                                         '/// Build the authenticated OpenAI-compatible v3 application.\n'
                                         'pub fn fabric_gateway_app<T>(service: FabricGatewayService<T>) -> Router\n'
                                         'where\n'
                                         "    T: FabricUpstreamTransport + 'static,\n"
                                         '{\n'
                                         '    let state = Arc::new(service);\n'
                                         '    Router::new()\n'
                                         '        .route("/v1/chat/completions", post(chat::<T>))\n'
                                         '        .route("/v1/models", get(models::<T>))\n'
                                         '        .route("/health/live", get(liveness))\n'
                                         '        .route("/health/ready", get(readiness::<T>))\n'
                                         '        .route("/health", get(readiness::<T>))\n'
                                         '        .route("/metrics", get(metrics::<T>))\n'
                                         '        .layer(middleware::from_fn(security_headers))\n'
                                         '        .with_state(state)\n'
                                         '}\n'
                                         '\n'
                                         'async fn chat<T>(\n'
                                         '    State(service): State<Arc<FabricGatewayService<T>>>,\n'
                                         '    request: Request<Body>,\n'
                                         ') -> Response<Body>\n'
                                         'where\n'
                                         "    T: FabricUpstreamTransport + 'static,\n"
                                         '{\n'
                                         '    service.handle_http_chat(request).await\n'
                                         '}\n'
                                         '\n'
                                         'async fn models<T>(\n'
                                         '    State(service): State<Arc<FabricGatewayService<T>>>,\n'
                                         '    headers: HeaderMap,\n'
                                         ') -> Response<Body>\n'
                                         'where\n'
                                         "    T: FabricUpstreamTransport + 'static,\n"
                                         '{\n'
                                         '    if let Err(error) = service.authorize_metadata(&headers) {\n'
                                         '        return metadata_authorization_error(error);\n'
                                         '    }\n'
                                         '    let data = service\n'
                                         '        .model_ids()\n'
                                         '        .into_iter()\n'
                                         '        .map(|id| {\n'
                                         '            json!({\n'
                                         '                "id": id,\n'
                                         '                "object": "model",\n'
                                         '                "created": 0,\n'
                                         '                "owned_by": "octoroute"\n'
                                         '            })\n'
                                         '        })\n'
                                         '        .collect::<Vec<_>>();\n'
                                         '    Json(json!({"object": "list", "data": data})).into_response()\n'
                                         '}\n'
                                         '\n'
                                         'async fn liveness() -> Response<Body> {\n'
                                         '    Json(json!({"status": "ok", "config_version": 3})).into_response()\n'
                                         '}\n'
                                         '\n'
                                         'async fn readiness<T>(\n'
                                         '    State(service): State<Arc<FabricGatewayService<T>>>,\n'
                                         ') -> Response<Body>\n'
                                         'where\n'
                                         "    T: FabricUpstreamTransport + 'static,\n"
                                         '{\n'
                                         '    let readiness = service.readiness().await;\n'
                                         '    let pools = readiness\n'
                                         '        .pools()\n'
                                         '        .iter()\n'
                                         '        .map(|(name, state)| {\n'
                                         '            (\n'
                                         '                name.clone(),\n'
                                         '                Value::String(pool_state(*state).to_string()),\n'
                                         '            )\n'
                                         '        })\n'
                                         '        .collect::<Map<_, _>>();\n'
                                         '    let status = if readiness.is_ready() {\n'
                                         '        StatusCode::OK\n'
                                         '    } else {\n'
                                         '        StatusCode::SERVICE_UNAVAILABLE\n'
                                         '    };\n'
                                         '    (\n'
                                         '        status,\n'
                                         '        Json(json!({\n'
                                         '            "status": if readiness.is_ready() { "ready" } else { "not_ready" },\n'
                                         '            "config_version": 3,\n'
                                         '            "pools": pools,\n'
                                         '            "provider_runtime": "pending"\n'
                                         '        })),\n'
                                         '    )\n'
                                         '        .into_response()\n'
                                         '}\n'
                                         '\n'
                                         'async fn metrics<T>(\n'
                                         '    State(service): State<Arc<FabricGatewayService<T>>>,\n'
                                         '    headers: HeaderMap,\n'
                                         ') -> Response<Body>\n'
                                         'where\n'
                                         "    T: FabricUpstreamTransport + 'static,\n"
                                         '{\n'
                                         '    if let Err(error) = service.authorize_metadata(&headers) {\n'
                                         '        return metadata_authorization_error(error);\n'
                                         '    }\n'
                                         '    let mut response = Response::new(Body::from(service.metrics_text()));\n'
                                         '    response.headers_mut().insert(\n'
                                         '        CONTENT_TYPE,\n'
                                         '        HeaderValue::from_static("text/plain; version=0.0.4; charset=utf-8"),\n'
                                         '    );\n'
                                         '    response\n'
                                         '}\n'
                                         '\n'
                                         'fn metadata_authorization_error(error: MetadataAuthorizationError) -> Response<Body> {\n'
                                         '    build_metadata_authorization_error(error, &Uuid::new_v4().to_string())\n'
                                         '}\n'
                                         '\n'
                                         "fn pool_state(state: PoolAdmissionState) -> &'static str {\n"
                                         '    match state {\n'
                                         '        PoolAdmissionState::Ready => "ready",\n'
                                         '        PoolAdmissionState::Disabled => "disabled",\n'
                                         '        PoolAdmissionState::Incompatible => "incompatible",\n'
                                         '        PoolAdmissionState::Busy => "busy",\n'
                                         '        PoolAdmissionState::Unhealthy => "unavailable",\n'
                                         '        PoolAdmissionState::ContextOverflow => "context_overflow",\n'
                                         '    }\n'
                                         '}\n',
           'src/gateway/fabric/mod.rs': '//! Octoroute v3 inference-fabric primitives and executable local runtime.\n'
                                        '//!\n'
                                        '//! The v3 module remains separate from the proven v2 request path while provider\n'
                                        '//! adapters and the complete ordered route executor are built out.\n'
                                        '\n'
                                        'mod config;\n'
                                        'mod http;\n'
                                        'mod local_pool;\n'
                                        'mod policy;\n'
                                        'mod presets;\n'
                                        'mod service;\n'
                                        'mod transport;\n'
                                        '\n'
                                        'pub use config::{\n'
                                        '    FABRIC_CONFIG_VERSION, FabricConfig, FabricConfigError, FabricObservabilityConfig,\n'
                                        '    FabricServerConfig, FallbackTrigger, LocalMemberConfig, LocalPoolConfig, PoolStrategy,\n'
                                        '    ProviderConfig, ProviderKind, ProviderProfile, ProviderProtocol, ReasoningEffort,\n'
                                        '    RoutePrivacy, RouteTarget, VirtualRoute,\n'
                                        '};\n'
                                        'pub use http::fabric_gateway_app;\n'
                                        'pub use local_pool::{\n'
                                        '    LlamaCppPool, LlamaCppPoolBuildError, PoolAdmissionOutcome, PoolAdmissionState, PoolLease,\n'
                                        '};\n'
                                        'pub use policy::{\n'
                                        '    FabricRouteError, LocalRequirements, LocalSelection, MemberSnapshot, PoolSelectionError,\n'
                                        '    RoutePlan,\n'
                                        '};\n'
                                        'pub use presets::{PROVIDER_PRESETS, ProviderPreset, provider_preset};\n'
                                        'pub use service::{\n'
                                        '    FabricGatewayService, FabricGatewayServiceBuildError, FabricReadiness,\n'
                                        '};\n'
                                        'pub use transport::{FabricTransport, FabricUpstreamTransport};\n'
                                        '\n'
                                        '#[cfg(test)]\n'
                                        'mod local_pool_tests;\n'
                                        '#[cfg(test)]\n'
                                        'mod service_tests;\n'
                                        '#[cfg(test)]\n'
                                        'mod tests;\n',
           'src/gateway/fabric/service.rs': '//! Authenticated v3 orchestration for virtual routes and local inference pools.\n'
                                            '\n'
                                            'use super::{\n'
                                            '    FabricConfig, FabricRouteError, FabricTransport, FabricUpstreamTransport, '
                                            'FallbackTrigger,\n'
                                            '    LlamaCppPool, LlamaCppPoolBuildError, PoolAdmissionOutcome, PoolAdmissionState, '
                                            'RoutePlan,\n'
                                            '    RouteTarget,\n'
                                            '};\n'
                                            'use crate::gateway::{\n'
                                            '    auth::BearerAuthenticator,\n'
                                            '    config::Environment,\n'
                                            '    request::GatewayRequest,\n'
                                            '    routing::PrivacyDirective,\n'
                                            '    service::{\n'
                                            '        FixedWindowRateLimiter, MetadataAuthorizationError, '
                                            'OCTOROUTE_REQUEST_ID_HEADER,\n'
                                            '        REQUEST_ID_HEADER, error_response, header_bytes, hold_response_guard, '
                                            'insert_header,\n'
                                            '        metadata_authorization_error, rate_limit_response,\n'
                                            '    },\n'
                                            '    transport::{GatewayTransportError, PreparedUpstreamResponse},\n'
                                            '};\n'
                                            'use axum::{\n'
                                            '    body::{Body, Bytes, to_bytes},\n'
                                            '    http::{HeaderMap, Request, Response, StatusCode},\n'
                                            '};\n'
                                            'use futures::future::join_all;\n'
                                            'use secrecy::SecretString;\n'
                                            'use std::{\n'
                                            '    collections::{BTreeMap, BTreeSet},\n'
                                            '    sync::Arc,\n'
                                            '};\n'
                                            'use thiserror::Error;\n'
                                            'use tokio::sync::{OwnedSemaphorePermit, Semaphore};\n'
                                            'use uuid::Uuid;\n'
                                            '\n'
                                            'const DESTINATION_HEADER: &str = "x-octoroute-destination";\n'
                                            'const REASON_HEADER: &str = "x-octoroute-reason";\n'
                                            'const UPSTREAM_HEADER: &str = "x-octoroute-upstream";\n'
                                            'const ROUTE_HEADER: &str = "x-octoroute-route";\n'
                                            'const POOL_HEADER: &str = "x-octoroute-pool";\n'
                                            'const MEMBER_HEADER: &str = "x-octoroute-member";\n'
                                            'const MODEL_REVISION_HEADER: &str = "x-octoroute-model-revision";\n'
                                            '\n'
                                            '/// Executable v3 gateway service. This first runtime slice dispatches local-pool '
                                            'steps.\n'
                                            'pub struct FabricGatewayService<T> {\n'
                                            '    config: Arc<FabricConfig>,\n'
                                            '    authenticator: BearerAuthenticator,\n'
                                            '    pools: BTreeMap<String, LlamaCppPool>,\n'
                                            '    transport: T,\n'
                                            '    inbound_permits: Arc<Semaphore>,\n'
                                            '    rate_limiter: FixedWindowRateLimiter,\n'
                                            '}\n'
                                            '\n'
                                            '/// Bounded v3 readiness snapshot.\n'
                                            '#[derive(Debug, Clone)]\n'
                                            'pub struct FabricReadiness {\n'
                                            '    pools: BTreeMap<String, PoolAdmissionState>,\n'
                                            '}\n'
                                            '\n'
                                            'impl FabricReadiness {\n'
                                            '    pub fn pools(&self) -> &BTreeMap<String, PoolAdmissionState> {\n'
                                            '        &self.pools\n'
                                            '    }\n'
                                            '\n'
                                            '    pub fn is_ready(&self) -> bool {\n'
                                            '        self.pools\n'
                                            '            .values()\n'
                                            '            .any(|state| *state == PoolAdmissionState::Ready)\n'
                                            '    }\n'
                                            '}\n'
                                            '\n'
                                            'impl<T> FabricGatewayService<T>\n'
                                            'where\n'
                                            '    T: FabricUpstreamTransport,\n'
                                            '{\n'
                                            '    /// Build the v3 service and resolve only secrets needed by the inbound API and '
                                            'enabled pools.\n'
                                            '    pub fn new(\n'
                                            '        config: FabricConfig,\n'
                                            '        environment: &impl Environment,\n'
                                            '        transport: T,\n'
                                            '    ) -> Result<Self, FabricGatewayServiceBuildError> {\n'
                                            '        let inbound_key = resolve_secret(\n'
                                            '            environment,\n'
                                            '            "server.api_key_env",\n'
                                            '            config.server.api_key_env.as_str(),\n'
                                            '        )?;\n'
                                            '        let mut pools = BTreeMap::new();\n'
                                            '        for (name, pool_config) in &config.local_pools {\n'
                                            '            if !pool_config.enabled {\n'
                                            '                continue;\n'
                                            '            }\n'
                                            '            let pool = LlamaCppPool::new(pool_config, environment).map_err(|source| {\n'
                                            '                FabricGatewayServiceBuildError::Pool {\n'
                                            '                    pool: name.clone(),\n'
                                            '                    source,\n'
                                            '                }\n'
                                            '            })?;\n'
                                            '            pools.insert(name.clone(), pool);\n'
                                            '        }\n'
                                            '\n'
                                            '        Ok(Self {\n'
                                            '            authenticator: BearerAuthenticator::new(inbound_key),\n'
                                            '            inbound_permits: '
                                            'Arc::new(Semaphore::new(config.server.max_in_flight)),\n'
                                            '            rate_limiter: '
                                            'FixedWindowRateLimiter::new(config.server.requests_per_minute),\n'
                                            '            config: Arc::new(config),\n'
                                            '            pools,\n'
                                            '            transport,\n'
                                            '        })\n'
                                            '    }\n'
                                            '\n'
                                            '    /// Authenticate, route, dispatch, and stream one bounded chat-completions request.\n'
                                            '    pub async fn handle_chat(&self, headers: &HeaderMap, bytes: Bytes) -> Response<Body> {\n'
                                            '        let (request_id, permit) = match self.preflight(headers) {\n'
                                            '            Ok(preflight) => preflight,\n'
                                            '            Err(response) => return *response,\n'
                                            '        };\n'
                                            '        if bytes.len() > self.config.server.max_request_bytes {\n'
                                            '            return hold_response_guard(\n'
                                            '                error_response(\n'
                                            '                    StatusCode::PAYLOAD_TOO_LARGE,\n'
                                            '                    "request body exceeds the configured size limit",\n'
                                            '                    "invalid_request_error",\n'
                                            '                    "request_too_large",\n'
                                            '                    &request_id,\n'
                                            '                ),\n'
                                            '                permit,\n'
                                            '            );\n'
                                            '        }\n'
                                            '        let response = self\n'
                                            '            .handle_authorized_chat(headers, bytes, &request_id)\n'
                                            '            .await;\n'
                                            '        hold_response_guard(response, permit)\n'
                                            '    }\n'
                                            '\n'
                                            '    /// Authenticate headers before reading a bounded HTTP body.\n'
                                            '    pub async fn handle_http_chat(&self, request: Request<Body>) -> Response<Body> {\n'
                                            '        let (parts, body) = request.into_parts();\n'
                                            '        let (request_id, permit) = match self.preflight(&parts.headers) {\n'
                                            '            Ok(preflight) => preflight,\n'
                                            '            Err(response) => return *response,\n'
                                            '        };\n'
                                            '        let bytes = match to_bytes(body, '
                                            'self.config.server.max_request_bytes).await {\n'
                                            '            Ok(bytes) => bytes,\n'
                                            '            Err(_) => {\n'
                                            '                return hold_response_guard(\n'
                                            '                    error_response(\n'
                                            '                        StatusCode::PAYLOAD_TOO_LARGE,\n'
                                            '                        "request body exceeds the configured size limit",\n'
                                            '                        "invalid_request_error",\n'
                                            '                        "request_too_large",\n'
                                            '                        &request_id,\n'
                                            '                    ),\n'
                                            '                    permit,\n'
                                            '                );\n'
                                            '            }\n'
                                            '        };\n'
                                            '        let response = self\n'
                                            '            .handle_authorized_chat(&parts.headers, bytes, &request_id)\n'
                                            '            .await;\n'
                                            '        hold_response_guard(response, permit)\n'
                                            '    }\n'
                                            '\n'
                                            '    pub fn authorize_metadata(\n'
                                            '        &self,\n'
                                            '        headers: &HeaderMap,\n'
                                            '    ) -> Result<(), MetadataAuthorizationError> {\n'
                                            '        if header_bytes(headers) > self.config.server.max_header_bytes {\n'
                                            '            return Err(MetadataAuthorizationError::HeadersTooLarge);\n'
                                            '        }\n'
                                            '        self.authenticator\n'
                                            '            .authorize(headers)\n'
                                            '            .map_err(|_| MetadataAuthorizationError::Unauthorized)\n'
                                            '    }\n'
                                            '\n'
                                            '    /// Virtual model identifiers exposed to OpenAI-compatible clients.\n'
                                            '    pub fn model_ids(&self) -> Vec<String> {\n'
                                            '        let mut models = BTreeSet::from(["auto".to_string()]);\n'
                                            '        models.extend(self.config.routes.keys().cloned());\n'
                                            '        models.into_iter().collect()\n'
                                            '    }\n'
                                            '\n'
                                            '    /// Probe all configured local pools concurrently.\n'
                                            '    pub async fn readiness(&self) -> FabricReadiness {\n'
                                            '        let probes = self.config.local_pools.iter().map(|(name, pool_config)| {\n'
                                            '            let pool = self.pools.get(name).cloned();\n'
                                            '            let name = name.clone();\n'
                                            '            let enabled = pool_config.enabled;\n'
                                            '            async move {\n'
                                            '                let state = if !enabled {\n'
                                            '                    PoolAdmissionState::Disabled\n'
                                            '                } else {\n'
                                            '                    match pool {\n'
                                            '                        Some(pool) => pool.readiness_state().await,\n'
                                            '                        None => PoolAdmissionState::Unhealthy,\n'
                                            '                    }\n'
                                            '                };\n'
                                            '                (name, state)\n'
                                            '            }\n'
                                            '        });\n'
                                            '        FabricReadiness {\n'
                                            '            pools: join_all(probes).await.into_iter().collect(),\n'
                                            '        }\n'
                                            '    }\n'
                                            '\n'
                                            '    /// Bootstrap Prometheus exposition while detailed v3 metrics are added.\n'
                                            '    pub fn metrics_text(&self) -> String {\n'
                                            '        let mut output = String::from(\n'
                                            '            "# HELP octoroute_fabric_runtime_info V3 inference-fabric runtime '
                                            'information.\\n\\\n                 # TYPE octoroute_fabric_runtime_info gauge\\n\\\n                 '
                                            'octoroute_fabric_runtime_info{config_version=\\\"3\\\",provider_runtime=\\\"pending\\\"} '
                                            '1\\n\\\n                 # HELP octoroute_fabric_pool_enabled Whether a configured local pool is '
                                            'enabled.\\n\\\n                 # TYPE octoroute_fabric_pool_enabled gauge\\n",\n'
                                            '        );\n'
                                            '        for (name, pool) in &self.config.local_pools {\n'
                                            '            let enabled = u8::from(pool.enabled);\n'
                                            '            output.push_str(&format!(\n'
                                            '                '
                                            '"octoroute_fabric_pool_enabled{{pool=\\\"{name}\\\"}} {enabled}\\n"\n'
                                            '            ));\n'
                                            '        }\n'
                                            '        output\n'
                                            '    }\n'
                                            '\n'
                                            '    fn preflight(\n'
                                            '        &self,\n'
                                            '        headers: &HeaderMap,\n'
                                            '    ) -> Result<(String, OwnedSemaphorePermit), Box<Response<Body>>> {\n'
                                            '        let request_id = Uuid::new_v4().to_string();\n'
                                            '        if let Err(error) = self.authorize_metadata(headers) {\n'
                                            '            return Err(Box::new(metadata_authorization_error(\n'
                                            '                error,\n'
                                            '                &request_id,\n'
                                            '            )));\n'
                                            '        }\n'
                                            '        if !self.rate_limiter.allow() {\n'
                                            '            return Err(Box::new(rate_limit_response(\n'
                                            '                "authenticated request rate limit exceeded",\n'
                                            '                "rate_limit_exceeded",\n'
                                            '                &request_id,\n'
                                            '            )));\n'
                                            '        }\n'
                                            '        let permit = match '
                                            'Arc::clone(&self.inbound_permits).try_acquire_owned() {\n'
                                            '            Ok(permit) => permit,\n'
                                            '            Err(_) => {\n'
                                            '                return Err(Box::new(rate_limit_response(\n'
                                            '                    "authenticated request concurrency limit exceeded",\n'
                                            '                    "request_concurrency_limit",\n'
                                            '                    &request_id,\n'
                                            '                )));\n'
                                            '            }\n'
                                            '        };\n'
                                            '        Ok((request_id, permit))\n'
                                            '    }\n'
                                            '\n'
                                            '    async fn handle_authorized_chat(\n'
                                            '        &self,\n'
                                            '        headers: &HeaderMap,\n'
                                            '        bytes: Bytes,\n'
                                            '        request_id: &str,\n'
                                            '    ) -> Response<Body> {\n'
                                            '        let request = match GatewayRequest::parse(&bytes) {\n'
                                            '            Ok(request) => request,\n'
                                            '            Err(error) => {\n'
                                            '                return error_response(\n'
                                            '                    StatusCode::BAD_REQUEST,\n'
                                            '                    &error.to_string(),\n'
                                            '                    "invalid_request_error",\n'
                                            '                    "invalid_request",\n'
                                            '                    request_id,\n'
                                            '                );\n'
                                            '            }\n'
                                            '        };\n'
                                            '        let privacy = match PrivacyDirective::from_headers(headers) {\n'
                                            '            Ok(privacy) => privacy,\n'
                                            '            Err(error) => {\n'
                                            '                return error_response(\n'
                                            '                    StatusCode::BAD_REQUEST,\n'
                                            '                    &error.to_string(),\n'
                                            '                    "invalid_request_error",\n'
                                            '                    "invalid_privacy_directive",\n'
                                            '                    request_id,\n'
                                            '                );\n'
                                            '            }\n'
                                            '        };\n'
                                            '        let plan = match self.config.route_plan(\n'
                                            '            request.model(),\n'
                                            '            privacy == PrivacyDirective::LocalOnly,\n'
                                            '        ) {\n'
                                            '            Ok(plan) => plan,\n'
                                            '            Err(error) => return route_error(error, request_id),\n'
                                            '        };\n'
                                            '        self.dispatch_route(&request, &plan, request_id).await\n'
                                            '    }\n'
                                            '\n'
                                            '    async fn dispatch_route(\n'
                                            '        &self,\n'
                                            '        request: &GatewayRequest,\n'
                                            '        plan: &RoutePlan,\n'
                                            '        request_id: &str,\n'
                                            '    ) -> Response<Body> {\n'
                                            '        for (index, step) in plan.steps.iter().enumerate() {\n'
                                            '            let has_more = index + 1 < plan.steps.len();\n'
                                            '            match step {\n'
                                            '                RouteTarget::LocalPool(pool_name) => {\n'
                                            '                    let outcome = match self.pools.get(pool_name) {\n'
                                            '                        Some(pool) => match pool.try_admit(request).await {\n'
                                            '                            Ok(outcome) => outcome,\n'
                                            '                            Err(error) => {\n'
                                            '                                return error_response(\n'
                                            '                                    StatusCode::BAD_REQUEST,\n'
                                            '                                    &error.to_string(),\n'
                                            '                                    "invalid_request_error",\n'
                                            '                                    "invalid_token_budget",\n'
