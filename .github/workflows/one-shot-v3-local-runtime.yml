           'src/main.rs': '//! Octoroute version-aware local/cloud gateway.\n'
                          '\n'
                          'use clap::Parser;\n'
                          'use octoroute::{\n'
                          '    calibration::{CalibrationError, MAX_ARTIFACT_BYTES, analyze_jsonl},\n'
                          '    cli::{Cli, Command, generate_config_template},\n'
                          '    gateway::{\n'
                          '        config::ProcessEnvironment,\n'
                          '        env::DotenvEnvironment,\n'
                          '        fabric::{FabricGatewayService, fabric_gateway_app},\n'
                          '        http::gateway_app,\n'
                          '        runtime::RuntimeConfig,\n'
                          '        service::GatewayService,\n'
                          '    },\n'
                          '    telemetry,\n'
                          '};\n'
                          'use std::{\n'
                          '    io::{Read, Write},\n'
                          '    net::SocketAddr,\n'
                          '    path::{Path, PathBuf},\n'
                          '};\n'
                          '\n'
                          '#[tokio::main]\n'
                          'async fn main() -> Result<(), Box<dyn std::error::Error>> {\n'
                          '    let cli = Cli::parse();\n'
                          '    match cli.command {\n'
                          '        Some(Command::Config { output }) => handle_config_command(output),\n'
                          '        Some(Command::Calibrate {\n'
                          '            input,\n'
                          '            output,\n'
                          '            grid_step,\n'
                          '        }) => handle_calibrate_command(&input, output, grid_step),\n'
                          '        None => run_server(Path::new(&cli.config)).await,\n'
                          '    }\n'
                          '}\n'
                          '\n'
                          'fn handle_calibrate_command(\n'
                          '    input: &str,\n'
                          '    output: Option<String>,\n'
                          '    grid_step: f64,\n'
                          ') -> Result<(), Box<dyn std::error::Error>> {\n'
                          '    let artifact = read_bounded_artifact(std::fs::File::open(input)?, '
                          'MAX_ARTIFACT_BYTES)?;\n'
                          '    let report = analyze_jsonl(&artifact, grid_step)?;\n'
                          '    match output {\n'
                          '        Some(path) => {\n'
                          '            let path = PathBuf::from(path);\n'
                          '            write_new_artifact(&path, "calibration report", report.as_bytes())?;\n'
                          '        }\n'
                          '        None => println!("{report}"),\n'
                          '    }\n'
                          '    Ok(())\n'
                          '}\n'
                          '\n'
                          'fn read_bounded_artifact(\n'
                          '    reader: impl Read,\n'
                          '    max_bytes: usize,\n'
                          ') -> Result<String, Box<dyn std::error::Error>> {\n'
                          '    // Read one extra byte so non-regular or concurrently growing inputs cannot bypass the '
                          'cap.\n'
                          '    let read_limit = u64::try_from(max_bytes)?.saturating_add(1);\n'
                          '    let mut bytes = Vec::new();\n'
                          '    reader.take(read_limit).read_to_end(&mut bytes)?;\n'
                          '    if bytes.len() > max_bytes {\n'
                          '        return Err(CalibrationError::ArtifactTooLarge.into());\n'
                          '    }\n'
                          '    String::from_utf8(bytes).map_err(|_| CalibrationError::InvalidEncoding.into())\n'
                          '}\n'
                          '\n'
                          'fn handle_config_command(output: Option<String>) -> Result<(), Box<dyn std::error::Error>> {\n'
                          '    let template = generate_config_template();\n'
                          '    match output {\n'
                          '        Some(path) => {\n'
                          '            let path = PathBuf::from(path);\n'
                          '            write_new_artifact(&path, "configuration file", template.as_bytes())?;\n'
                          '            eprintln!("Octoroute v2 configuration written to {}", path.display());\n'
                          '            eprintln!(\n'
                          '                "Add OCTOROUTE_API_KEY and OPENROUTER_API_KEY to {} or the process '
                          'environment.",\n'
                          '                path.parent()\n'
                          '                    .unwrap_or_else(|| Path::new("."))\n'
                          '                    .join(".env")\n'
                          '                    .display()\n'
                          '            );\n'
                          '        }\n'
                          '        None => print!("{template}"),\n'
                          '    }\n'
                          '    Ok(())\n'
                          '}\n'
                          '\n'
                          'fn write_new_artifact(path: &Path, label: &str, contents: &[u8]) -> std::io::Result<()> {\n'
                          '    let mut file = std::fs::OpenOptions::new()\n'
                          '        .write(true)\n'
                          '        .create_new(true)\n'
                          '        .open(path)\n'
                          '        .map_err(|error| {\n'
                          '            if error.kind() == std::io::ErrorKind::AlreadyExists {\n'
                          '                std::io::Error::new(\n'
                          '                    error.kind(),\n'
                          '                    format!("{label} `{}` already exists", path.display()),\n'
                          '                )\n'
                          '            } else {\n'
                          '                error\n'
                          '            }\n'
                          '        })?;\n'
                          '    file.write_all(contents)\n'
                          '}\n'
                          '\n'
                          'async fn run_server(config_path: &Path) -> Result<(), Box<dyn std::error::Error>> {\n'
                          '    let input = std::fs::read_to_string(config_path)?;\n'
                          '    let dotenv_path = config_path\n'
                          '        .parent()\n'
                          '        .unwrap_or_else(|| Path::new("."))\n'
                          '        .join(".env");\n'
                          '    let environment = DotenvEnvironment::from_optional_path(&dotenv_path, '
                          'ProcessEnvironment)?;\n'
                          '\n'
                          '    let (address, app, version, log_level) =\n'
                          '        match RuntimeConfig::from_toml(&input, &environment)? {\n'
                          '            RuntimeConfig::V2(config) => {\n'
                          '                let address =\n'
                          '                    SocketAddr::from((config.server().host(), config.server().port()));\n'
                          '                let log_level = config.observability().log_level().as_str().to_string();\n'
                          '                let service = GatewayService::from_config(*config)?;\n'
                          '                (address, gateway_app(service), 2_u8, log_level)\n'
                          '            }\n'
                          '            RuntimeConfig::V3(config) => {\n'
                          '                let address = SocketAddr::from((config.server.host, config.server.port));\n'
                          '                let log_level = config.observability.log_level.clone();\n'
                          '                let service = FabricGatewayService::from_config(*config, &environment)?;\n'
                          '                (address, fabric_gateway_app(service), 3_u8, log_level)\n'
                          '            }\n'
                          '        };\n'
                          '    telemetry::init(&log_level);\n'
                          '\n'
                          '    tracing::info!(%address, config_version = version, "starting Octoroute gateway");\n'
                          '    tracing::info!("POST /v1/chat/completions");\n'
                          '    tracing::info!("GET /v1/models");\n'
                          '    tracing::info!("GET /health/live, /health/ready, /health");\n'
                          '    tracing::info!("GET /metrics");\n'
                          '\n'
                          '    let listener = tokio::net::TcpListener::bind(address).await?;\n'
                          '    axum::serve(listener, app)\n'
                          '        .with_graceful_shutdown(shutdown_signal())\n'
                          '        .await?;\n'
                          '    tracing::info!("Octoroute shutdown complete");\n'
                          '    Ok(())\n'
                          '}\n'
                          '\n'
                          'async fn shutdown_signal() {\n'
                          '    let ctrl_c = async {\n'
                          '        tokio::signal::ctrl_c()\n'
                          '            .await\n'
                          '            .expect("failed to install Ctrl+C handler");\n'
                          '    };\n'
                          '\n'
                          '    #[cfg(unix)]\n'
                          '    let terminate = async {\n'
                          '        tokio::signal::unix::signal(tokio::signal::unix::SignalKind::terminate())\n'
                          '            .expect("failed to install SIGTERM handler")\n'
                          '            .recv()\n'
                          '            .await;\n'
                          '    };\n'
                          '\n'
                          '    #[cfg(not(unix))]\n'
                          '    let terminate = std::future::pending::<()>();\n'
                          '\n'
                          '    tokio::select! {\n'
                          '        _ = ctrl_c => tracing::info!("received SIGINT"),\n'
                          '        _ = terminate => tracing::info!("received SIGTERM"),\n'
                          '    }\n'
                          '}\n'
                          '\n'
                          '#[cfg(test)]\n'
                          'mod tests {\n'
                          '    use super::*;\n'
                          '\n'
                          '    #[test]\n'
                          '    fn calibration_reader_enforces_limit_during_read() {\n'
                          '        let accepted = read_bounded_artifact(std::io::Cursor::new(b"test"), 4)\n'
                          '            .expect("artifact at the byte limit");\n'
                          '        assert_eq!(accepted, "test");\n'
                          '\n'
                          "        let error = read_bounded_artifact(std::io::repeat(b'x'), 4)\n"
                          '            .expect_err("an unbounded reader must stop at the byte limit");\n'
                          '        assert!(matches!(\n'
                          '            error.downcast_ref::<CalibrationError>(),\n'
                          '            Some(CalibrationError::ArtifactTooLarge)\n'
                          '        ));\n'
                          '    }\n'
                          '}\n'}
