           'src/gateway/fabric/transport.rs': '//! Shared pre-commit HTTP transport for v3 local-pool leases.\n'
                                              '\n'
                                              'use super::PoolLease;\n'
                                              'use crate::gateway::{\n'
                                              '    http_client::{authorized, build},\n'
                                              '    transport::{\n'
                                              '        GatewayTransportError, PendingUpstreamResponse, '
                                              'PreparedUpstreamResponse,\n'
                                              '    },\n'
                                              '};\n'
                                              'use async_trait::async_trait;\n'
                                              'use reqwest::{Client, header::CONTENT_TYPE};\n'
                                              '\n'
                                              '/// Testable v3 transport contract. Provider methods will be added with the provider '
                                              'registry.\n'
                                              '#[async_trait]\n'
                                              'pub trait FabricUpstreamTransport: Send + Sync {\n'
                                              "    type Error: std::error::Error + Send + Sync + 'static;\n"
                                              '\n'
                                              '    /// Dispatch one selected local member and stop before client commitment.\n'
                                              '    async fn local(&self, lease: PoolLease) -> '
                                              'Result<PreparedUpstreamResponse, Self::Error>;\n'
                                              '}\n'
                                              '\n'
                                              '/// Production v3 transport using the same held first-byte stream as the v2 gateway.\n'
                                              '#[derive(Clone)]\n'
                                              'pub struct FabricTransport {\n'
                                              '    client: Client,\n'
                                              '}\n'
                                              '\n'
                                              'impl FabricTransport {\n'
                                              '    pub fn new() -> Result<Self, GatewayTransportError> {\n'
                                              '        Ok(Self {\n'
                                              '            client: build().map_err(GatewayTransportError::HttpClient)?,\n'
                                              '        })\n'
                                              '    }\n'
                                              '\n'
                                              '}\n'
                                              '\n'
                                              '#[async_trait]\n'
                                              'impl FabricUpstreamTransport for FabricTransport {\n'
                                              '    type Error = GatewayTransportError;\n'
                                              '\n'
