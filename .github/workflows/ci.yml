name: CI

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 5 * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    if: &regular_ci github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust:
          - stable
          - 1.90.0 # MSRV
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (all features)
        run: cargo test --locked --all-targets --all-features --verbose

      - name: Run tests (no features)
        run: cargo test --locked --no-default-features --verbose

  clippy:
    name: Clippy (Linting)
    if: *regular_ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy (zero warnings policy)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  fmt:
    name: Format Check
    if: *regular_ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security:
    name: RustSec Audit
    if: *regular_ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  # Ordinary CI admits mutation work only for added, modified, deleted, or renamed
  # tests. Inline tests scope to every mutant in their owning source file; ambiguous
  # integration tests and fixtures conservatively expand to the full sweep. Monthly
  # and manual runs are always full. Production-only revisions start no shards.
  mutation-policy:
    name: Mutation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.test-policy.outputs.run }}
      mode: ${{ steps.test-policy.outputs.mode }}
      base: ${{ steps.test-policy.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0

      - name: Classify mutation scope from test changes
        id: test-policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            run=true
            mode=full
            base=
          else
            if [[ "$EVENT_NAME" == pull_request ]]; then
              base="$(git merge-base HEAD "origin/$BASE_REF")"
            elif [[ "$PUSH_BASE" =~ ^0+$ ]]; then
              base="$(git merge-base HEAD origin/main)"
            else
              base="$PUSH_BASE"
            fi
            mapfile -t mutation_scope < <(./scripts/mutants-ci-scope.sh "$base" HEAD)
            mode="${mutation_scope[0]:-}"
            case "$mode" in
              none) run=false ;;
              files|full) run=true ;;
              *) echo "mutation policy returned invalid mode: $mode" >&2; exit 64 ;;
            esac
          fi
          {
            echo "run=$run"
            echo "mode=$mode"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          echo "mutation scope: $mode"

  mutants:
    name: Mutation Testing (shard ${{ matrix.shard.label }}/8)
    needs: mutation-policy
    if: needs.mutation-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants numbers shards from zero; keep a separate one-based
        # label so the job names remain natural for humans.
        shard:
          - { index: 0, label: 1 }
          - { index: 1, label: 2 }
          - { index: 2, label: 3 }
          - { index: 3, label: 4 }
          - { index: 4, label: 5 }
          - { index: 5, label: 6 }
          - { index: 6, label: 7 }
          - { index: 7, label: 8 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutation sweep
        shell: bash
        env:
          MUTATION_BASE: ${{ needs.mutation-policy.outputs.base }}
          MUTATION_MODE: ${{ needs.mutation-policy.outputs.mode }}
        run: |
          set -euo pipefail
          mutation_args=()
          if [[ "$MUTATION_MODE" == files ]]; then
            mapfile -t mutation_scope < <(./scripts/mutants-ci-scope.sh "$MUTATION_BASE" HEAD)
            [[ "${mutation_scope[0]:-}" == files ]]
            mutation_args=("${mutation_scope[@]:1}")
          fi
          set +e
          ./scripts/mutants-run.sh "${mutation_args[@]}" --shard ${{ matrix.shard.index }}/8
          status=$?
          set -e
          missed=target/mutants/mutants.out/missed.txt
          if [[ "$status" -eq 2 && -s "$missed" ]]; then
            report_dir="$RUNNER_TEMP/mutation-repair"
            mkdir -p "$report_dir"
            for report in missed.txt timeout.txt outcomes.json; do
              source_report="target/mutants/mutants.out/$report"
              [[ -f "$source_report" && ! -L "$source_report" ]] || continue
              cp -- "$source_report" "$report_dir/$report"
            done
          fi
          exit "$status"

      - name: Retain mutation repair evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-repair-shard-${{ matrix.shard.label }}
          path: |
            ${{ runner.temp }}/mutation-repair/missed.txt
            ${{ runner.temp }}/mutation-repair/timeout.txt
            ${{ runner.temp }}/mutation-repair/outcomes.json
          if-no-files-found: ignore
          retention-days: 30

  docs:
    name: Documentation Build
    if: *regular_ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
