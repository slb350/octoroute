name: CI

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 5 * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    if: &regular_ci github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust:
          - stable
          - 1.90.0 # MSRV
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (all features)
        run: cargo test --locked --all-targets --all-features --verbose

      - name: Run tests (no features)
        run: cargo test --locked --no-default-features --verbose

  clippy:
    name: Clippy (Linting)
    if: *regular_ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy (zero warnings policy)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  fmt:
    name: Format Check
    if: *regular_ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security:
    name: RustSec Audit
    if: *regular_ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  # Ordinary CI admits no mutation work unless its complete pushed or pull-request
  # diff adds a Rust test declaration. Monthly and manual runs are explicit full
  # sweeps. Keeping this decision in one preflight avoids starting eight expensive
  # shard jobs merely to discover there is nothing to mutate.
  mutation-policy:
    name: Mutation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.test-policy.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0

      - name: Detect newly added Rust tests
        id: test-policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git merge-base HEAD "origin/$BASE_REF")"
          elif [[ "$PUSH_BASE" =~ ^0+$ ]]; then
            base="$(git merge-base HEAD origin/main)"
          else
            base="$PUSH_BASE"
          fi
          git diff --unified=0 "$base" HEAD -- '*.rs' > "$RUNNER_TEMP/new-tests.diff"
          if grep -Eq '^\+[[:space:]]*#\[(test|[[:alnum:]_]+::test|rstest|test_case|case|parameterized)([[:space:](]|])' "$RUNNER_TEMP/new-tests.diff" ||
             grep -Eq '^\+[[:space:]]*//[/!][[:space:]]*```(rust)?' "$RUNNER_TEMP/new-tests.diff"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "new Rust tests detected; admitting the full mutation sweep"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no new Rust tests detected; mutation work is omitted"
          fi

  mutants:
    name: Mutation Testing (full sweep, shard ${{ matrix.shard.label }}/8)
    needs: mutation-policy
    if: needs.mutation-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants numbers shards from zero; keep a separate one-based
        # label so the job names remain natural for humans.
        shard:
          - { index: 0, label: 1 }
          - { index: 1, label: 2 }
          - { index: 2, label: 3 }
          - { index: 3, label: 4 }
          - { index: 4, label: 5 }
          - { index: 5, label: 6 }
          - { index: 6, label: 7 }
          - { index: 7, label: 8 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutation sweep
        run: ./scripts/mutants-run.sh --shard ${{ matrix.shard.index }}/8

  docs:
    name: Documentation Build
    if: *regular_ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
