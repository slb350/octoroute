[package]
name = "octoroute"
version = "3.0.5"
edition = "2024"
rust-version = "1.90"
authors = ["Steve Brandon"]
description = "OpenAI-compatible inference fabric for local pools and cloud providers"
license = "MIT"
repository = "https://github.com/slb350/octoroute"
exclude = ["AGENTS.md", "CLAUDE.md", ".Codex", "scripts", ".githooks", ".github", "docs/plans", "Cross.toml", "clippy.toml", "justfile", "rust-toolchain.toml", ".markdownlint.json", ".markdownlintignore"]

[dependencies]
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
secrecy = "0.10"
dotenvy = "0.15"
subtle = "2.6"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
# Keep the URL/IDNA graph above GHSA-7fx9-626j-vqph's vulnerable validators.
zerovec = "0.11.8"
zerovec-derive = "0.11.6"
# Keep downstream resolution above RUSTSEC-2026-0258's vulnerable h2 range.
h2 = "0.4.16"
# Keep downstream resolution above RUSTSEC-2026-0285 and the -0346..-0349
# rustls advisories' vulnerable range.
rustls = { version = "0.23.46", default-features = false }
# Keep the TLS verifier above RUSTSEC-2026-0382's vulnerable range: rustls only
# requires ^0.103.14, which still selects the affected 0.103.15.
rustls-webpki = { version = "0.103.16", default-features = false }
# Keep the bundled root store above RUSTSEC-2026-0381's vulnerable range:
# reqwest and hyper-rustls only require ^1, which still selects 1.0.9.
webpki-roots = { version = "1.0.10", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
