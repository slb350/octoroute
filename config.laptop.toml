# Octoroute v3 example for a gateway running on a client workstation.
# Secrets are loaded lazily from the ignored `.env` file beside this file.

config_version = 3

[server]
host = "127.0.0.1"
port = 8081
api_key_env = "OCTOROUTE_API_KEY"
max_request_bytes = 8388608
max_header_bytes = 32768
max_in_flight = 32
requests_per_minute = 120

[fabric]

[[fabric.local_pools]]
name = "workers"
enabled = true
model = "local-model"
model_revision = "example-local-revision"
context_window = 65536
context_safety_tokens = 1024
default_max_output_tokens = 4096
capabilities = ["chat", "stream", "tools", "structured_output", "reasoning"]
strategy = "least_loaded"
default_reasoning_effort = "medium"

[[fabric.local_pools.members]]
name = "local-model"
base_url = "http://local-model.local:8080"
max_in_flight = 1
priority = 100

[[fabric.providers]]
name = "openrouter"
enabled = true
kind = "http"
endpoint = "https://openrouter.ai/api/v1"
protocol = "open_ai"
model = "openrouter/auto"
api_key_env = "OPENROUTER_API_KEY"
max_in_flight = 4
timeout_ms = 1800000
priority = 10
temperature = 0.2
profile = "open_router_auto"

[routing]
default_model = "auto-route"

[[routing.routes]]
model = "auto-route"
privacy = "cloud_allowed"
steps = ["pool:workers", "provider:openrouter"]
default_reasoning_effort = "medium"
fallback_on = ["busy", "unhealthy", "context_overflow", "incompatible", "rate_limited", "precommit_failure"]

[[routing.routes]]
model = "worker"
privacy = "local_only"
steps = ["pool:workers"]
default_reasoning_effort = "medium"
fallback_on = ["busy", "unhealthy", "context_overflow", "incompatible", "precommit_failure"]

[[routing.routes]]
model = "local"
privacy = "local_only"
steps = ["pool:workers"]
default_reasoning_effort = "medium"
fallback_on = ["busy", "unhealthy", "context_overflow", "incompatible", "precommit_failure"]

[[routing.routes]]
model = "supervisor"
privacy = "cloud_only"
steps = ["provider:openrouter"]
default_reasoning_effort = "xhigh"
fallback_on = ["busy", "unhealthy", "rate_limited", "precommit_failure"]

[[routing.routes]]
model = "cloud-sota"
privacy = "cloud_only"
steps = ["provider:openrouter"]
default_reasoning_effort = "xhigh"
fallback_on = ["busy", "unhealthy", "rate_limited", "precommit_failure"]

[observability]
log_level = "info"
