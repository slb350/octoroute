# Octoroute v3 inference-fabric example.
#
# This file is parsed and tested by src/gateway/fabric. The v3 runtime wiring is
# being implemented on feat/v3-tiered-inference-fabric; config.toml remains the
# production v2 template until that migration is complete.

config_version = 3

[server]
host = "0.0.0.0"
port = 8081
api_key_env = "OCTOROUTE_API_KEY"
max_in_flight = 64

[fabric]

# Three independent Qwen3.8-27B workers, one per RTX 3080 20 GB card.
[[fabric.local_pools]]
name = "workers"
enabled = true
model = "qwen3.8-27b"
model_revision = "unsloth-ud-q4_k_m"
context_window = 131072
context_safety_tokens = 2048
default_max_output_tokens = 16384
capabilities = ["chat", "stream", "tools", "structured_output", "reasoning"]
strategy = "least_loaded"
default_reasoning_effort = "medium"

[[fabric.local_pools.members]]
name = "worker-0"
base_url = "http://gpu-box.local:8001"
max_in_flight = 1
priority = 100

[[fabric.local_pools.members]]
name = "worker-1"
base_url = "http://gpu-box.local:8002"
max_in_flight = 1
priority = 100

[[fabric.local_pools.members]]
name = "worker-2"
base_url = "http://gpu-box.local:8003"
max_in_flight = 1
priority = 100

# Disabled until the 256 GB M5 Ultra arrives. Enabling this pool should not
# require changing OpenCode or any other client-facing route.
[[fabric.local_pools]]
name = "supervisor-local"
enabled = false
model = "local-supervisor"
model_revision = "pending-m5-ultra-model"
context_window = 262144
context_safety_tokens = 4096
default_max_output_tokens = 32768
capabilities = ["chat", "stream", "tools", "structured_output", "image_input", "reasoning"]
strategy = "least_loaded"
default_reasoning_effort = "xhigh"

[[fabric.local_pools.members]]
name = "m5-ultra"
enabled = true
base_url = "http://m5-ultra.local:8000"
max_in_flight = 1
priority = 10

# Moonshot's Kimi for Coding plan. The endpoint speaks the Anthropic protocol,
# requires max_tokens, and rejects arbitrary temperature values.
[[fabric.providers]]
name = "kimi"
enabled = true
kind = "http"
endpoint = "https://api.kimi.com/coding/v1"
protocol = "anthropic"
model = "k3"
api_key_env = "KIMI_API_KEY"
max_in_flight = 2
timeout_ms = 1800000
priority = 10
max_tokens = 200000

# z.ai's GLM Coding Plan.
[[fabric.providers]]
name = "zai"
enabled = true
kind = "http"
endpoint = "https://api.z.ai/api/coding/paas/v4"
protocol = "open_ai"
model = "glm-5.3"
api_key_env = "ZAI_API_KEY"
max_in_flight = 2
timeout_ms = 1800000
priority = 20
temperature = 0.2

# OpenRouter remains the broad cloud fallback and SOTA model broker.
[[fabric.providers]]
name = "openrouter"
enabled = true
kind = "http"
endpoint = "https://openrouter.ai/api/v1"
protocol = "open_ai"
model = "openrouter/auto"
api_key_env = "OPENROUTER_API_KEY"
max_in_flight = 4
timeout_ms = 1800000
priority = 30
temperature = 0.2
profile = "open_router_auto"

# Direct OpenAI API use is optional and separately metered.
[[fabric.providers]]
name = "openai"
enabled = false
kind = "http"
endpoint = "https://api.openai.com/v1"
protocol = "open_ai"
model = "gpt-5.6-sol"
api_key_env = "OPENAI_API_KEY"
max_in_flight = 2
timeout_ms = 1800000
priority = 40
reasoning_effort = "xhigh"

# Subscription-backed Codex execution follows Drep's locked-down CLI pattern:
# ChatGPT-managed login, ephemeral runs, a filtered child environment, and no
# direct reading or storage of the account token by Octoroute.
[[fabric.providers]]
name = "codex"
enabled = true
kind = "codex_cli"
model = "gpt-5.6-sol"
max_in_flight = 1
timeout_ms = 1800000
priority = 50
reasoning_effort = "xhigh"

[routing]
default_model = "auto-route"

# Local-first general route. OpenCode should still request `worker` or
# `supervisor` explicitly when it has already classified the task.
[[routing.routes]]
model = "auto-route"
privacy = "cloud_allowed"
steps = ["pool:workers", "pool:supervisor-local", "provider:kimi", "provider:zai", "provider:openrouter"]
default_reasoning_effort = "medium"
fallback_on = ["busy", "unhealthy", "context_overflow", "incompatible", "rate_limited", "precommit_failure"]

# Bounded delegated work. This route can never disclose a prompt to cloud.
[[routing.routes]]
model = "worker"
privacy = "local_only"
steps = ["pool:workers"]
default_reasoning_effort = "medium"
fallback_on = ["busy", "unhealthy", "context_overflow", "incompatible", "precommit_failure"]

# High-level planning/review. It uses the Ultra when available and subscription
# plans until then. OpenCode chooses this route for complex work.
[[routing.routes]]
model = "supervisor"
privacy = "cloud_allowed"
steps = ["pool:supervisor-local", "provider:kimi", "provider:zai", "provider:openrouter", "provider:codex"]
default_reasoning_effort = "xhigh"
fallback_on = ["busy", "unhealthy", "context_overflow", "incompatible", "rate_limited", "precommit_failure"]

# Force all-local operation while still allowing worker-to-Ultra escalation.
[[routing.routes]]
model = "local"
privacy = "local_only"
steps = ["pool:workers", "pool:supervisor-local"]
default_reasoning_effort = "medium"
fallback_on = ["busy", "unhealthy", "context_overflow", "incompatible", "precommit_failure"]

# Deliberate SOTA escalation. Subscription Codex is preferred before metered
# OpenRouter/OpenAI, but every target is non-local by definition.
[[routing.routes]]
model = "cloud-sota"
privacy = "cloud_only"
steps = ["provider:codex", "provider:openrouter", "provider:openai"]
default_reasoning_effort = "xhigh"
fallback_on = ["busy", "unhealthy", "rate_limited", "precommit_failure"]

[observability]
log_level = "info"
